<style>
/* Layout: full-screen night map of one day; gold photo pins linked by arrows; a filmstrip of stops along the bottom; tapping opens the stop's card. Theme: a Paris Christmas night — fir green, berry red, candle gold, falling snow. */
:root{
  --bg:#0f2a22; --bg-deep:#0a1e18; --paper:#fffaf0; --ink:#1d2a24; --muted:#5f6b63; --line:#e8dcc4;
  --on-dark:#f6efe0; --on-dark-muted:#b9c9bd;
  --red:#c8283b; --red-deep:#8e1626; --gold:#e9b949; --gold-deep:#a87a12; --green:#1f6b4a;
  --route:#e9b949; --night:#ff6b6b;
  --display:"Mountains of Christmas", "Gloock", Georgia, serif;
  --serif:"Gloock", Georgia, serif;
  --body:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg-deep);color:var(--on-dark);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden}

/* Header with a string of lights */
header{position:relative;display:flex;gap:14px;align-items:center;
  padding:14px max(16px,env(safe-area-inset-right)) 22px max(16px,env(safe-area-inset-left));padding-top:max(14px,env(safe-area-inset-top));
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg-deep) 100%);z-index:2;
  border-bottom:3px solid var(--red)}
.plaque{background:var(--red);color:#fff;border:3px solid var(--gold);outline:2px solid var(--red);border-radius:8px;
  padding:4px 10px;text-align:center;min-width:76px;flex:none;box-shadow:0 0 18px rgba(233,185,73,.35)}
.plaque .arr{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.plaque .d{display:block;font-family:var(--serif);font-size:26px;line-height:1}
.plaque .wd{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
header h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,4.4vw,38px);margin:0;line-height:1.05;text-wrap:balance;color:var(--gold);
  text-shadow:0 0 14px rgba(233,185,73,.35)}
header p{margin:4px 0 0;color:var(--on-dark-muted);font-size:14px}
.titles{min-width:0}
.lights{position:absolute;left:0;right:0;bottom:-14px;height:24px;pointer-events:none;overflow:hidden}
.lights svg{width:100%;height:24px;display:block}
.bulb{animation:glow 1.6s ease-in-out infinite}
.bulb:nth-child(3n){animation-delay:.5s}.bulb:nth-child(3n+1){animation-delay:1s}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}

/* Map */
#mapwrap{position:relative;flex:1;min-height:0;isolation:isolate;z-index:1}
#map{position:absolute;inset:0;background:var(--bg-deep)}
#snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:500}
.leaflet-container{font-family:var(--body)}
.leaflet-control-attribution{background:rgba(10,30,24,.7)!important;color:var(--on-dark-muted)!important}
.leaflet-control-attribution a{color:var(--on-dark)!important}
.pin{position:relative;width:58px;height:58px;border-radius:50%;border:3px solid var(--gold);
  box-shadow:0 0 0 3px var(--red-deep),0 0 22px rgba(233,185,73,.55);
  background:#334 center/cover no-repeat;cursor:pointer;transition:transform .15s}
.pin.night{border-color:#fff;box-shadow:0 0 0 3px var(--red),0 0 26px rgba(255,255,255,.55)}
.pin:hover,.pin.active{transform:scale(1.15)}
.pin .n{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;
  font:700 13px/22px var(--body);text-align:center;border:2px solid var(--gold)}
.pin .t{position:absolute;top:62px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--paper);color:var(--ink);
  font:500 11px var(--mono);padding:1px 6px;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.leg{background:var(--bg);color:var(--on-dark);font:600 11px var(--body);padding:2px 7px;border-radius:99px;border:1px solid var(--gold-deep);white-space:nowrap}

/* Filmstrip */
.strip{display:flex;gap:12px;overflow-x:auto;padding:12px max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background:var(--bg);border-top:3px solid var(--red);z-index:2;scroll-snap-type:x proximity}
.frame{flex:none;width:132px;border:0;padding:0;background:var(--paper);border-radius:6px;overflow:hidden;text-align:left;color:var(--ink);
  cursor:pointer;box-shadow:0 0 0 2px var(--gold-deep),0 4px 12px rgba(0,0,0,.35);scroll-snap-align:start;font-family:var(--body);
  transform:rotate(-1.2deg);transition:transform .15s}
.frame:nth-child(2n){transform:rotate(1.2deg)}
.frame:hover,.frame:focus-visible,.frame.active{transform:rotate(0) translateY(-3px);box-shadow:0 0 0 3px var(--gold),0 6px 16px rgba(0,0,0,.45);outline:none}
.frame img{width:100%;height:72px;object-fit:cover;display:block}
.frame span{display:block;padding:5px 8px 7px;font-size:12px;line-height:1.25}
.frame b{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--red-deep);display:block}

/* Card: a Christmas card */
.scrim{position:fixed;inset:0;background:rgba(5,15,12,.6);z-index:1000;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.card{position:relative;background:var(--paper);color:var(--ink);width:min(520px,100%);max-height:calc(100% - 16px);overflow:auto;border-radius:14px;
  border:6px solid var(--red);outline:2px solid var(--gold);outline-offset:-12px;
  box-shadow:0 20px 50px rgba(0,0,0,.5);margin-bottom:max(0px,env(safe-area-inset-bottom))}
@media (min-width:700px){.scrim{align-items:center}}
.card figure{margin:0;position:relative}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--line)}
.card figcaption{position:absolute;right:10px;bottom:6px;font-size:10px;color:#fff;text-shadow:0 1px 3px #000}
.card figcaption a{color:#fff}
.card .close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:2px solid var(--gold);background:var(--red);color:#fff;font-size:20px;cursor:pointer}
.card .body{padding:16px 20px 20px;display:grid;gap:10px;
  background:radial-gradient(circle at 92% 8%,rgba(200,40,59,.07) 0 40px,transparent 41px)}
.card .meta{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted);flex-wrap:wrap}
.card .num{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font:700 13px/22px var(--body);text-align:center;border:2px solid var(--gold)}
.card h2{font-family:var(--display);font-weight:700;font-size:32px;margin:0;line-height:1.05;color:var(--red-deep)}
.card p{margin:0;line-height:1.55}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px}
.tag.book{background:var(--red);color:#fff}
.tag.market{background:var(--green);color:#fff}
.tip{background:#f3ead6;border-left:4px solid var(--green);border-radius:6px;padding:8px 10px;font-size:14px;color:var(--ink)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);text-decoration:none;
  color:var(--ink);font-weight:600;font-size:14px;background:#fff;cursor:pointer;font-family:var(--body)}
.btn:hover,.btn:focus-visible{border-color:var(--red);outline:none}
.nav{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.nav .next{margin-left:auto;background:var(--green);color:#fff;border-color:var(--green)}
.btn[disabled]{opacity:.4;cursor:default}
@media (prefers-reduced-motion:reduce){.pin,.frame{transition:none}.bulb{animation:none}}

/* Day tabs + countdown */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:16px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));background:var(--bg-deep);z-index:2;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;flex-direction:column;align-items:center;min-width:48px;padding:4px 8px;border-radius:8px;border:1px solid transparent;
  background:transparent;color:var(--on-dark-muted);font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tab b{font:400 20px/1.1 var(--serif);color:var(--on-dark);letter-spacing:0}
.tab:hover,.tab:focus-visible{border-color:var(--gold-deep);outline:none}
.tab[aria-selected="true"]{background:var(--red);border-color:var(--gold);color:#fff}
.tab[aria-selected="true"] b{color:#fff}
.count{margin-left:auto;flex:none;text-align:right;font:500 11px var(--mono);color:var(--on-dark-muted);letter-spacing:.06em;text-transform:uppercase}
.count b{display:block;font:400 26px/1 var(--serif);color:var(--gold);letter-spacing:0}
.pin.icon{display:grid;place-items:center;font-size:26px;background:radial-gradient(circle at 35% 30%,#e04a5c,var(--red-deep))}
.frame .ico{height:72px;display:grid;place-items:center;font-size:34px;background:radial-gradient(circle at 35% 30%,#e04a5c,var(--red-deep))}
.card .ico{aspect-ratio:16/7;display:grid;place-items:center;font-size:64px;background:radial-gradient(circle at 35% 30%,#e04a5c,var(--red-deep))}
.tag.star{background:var(--gold);color:var(--ink)}
@media (max-width:520px){.count{display:none}}
</style>
</head>

 {time:'12:30',name:'Lunch in Saint-Germain',ll:[48.8542,2.3326],text:'Café de Flore or one of the bistros on rue du Bac.',q:'Café de Flore, Paris',...ph('6/69/Caf%C3%A9_de_Flore%2C_172_boulevard_Saint-Germain%2C_Paris_6e.jpg/960px-Caf%C3%A9_de_Flore%2C_172_boulevard_Saint-Germain%2C_Paris_6e.jpg','Celette','CC BY-SA 4.0','Café_de_Flore,_172_boulevard_Saint-Germain,_Paris_6e.jpg'),leg:'25 min walk'},

const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const map=L.map('map',{zoomControl:true,scrollWheelZoom:true,maxZoom:16});
const ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
L.tileLayer(ESRI+'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'Tiles &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors · Photos: Wikimedia Commons'}).addTo(map);
L.tileLayer(ESRI+'World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:16}).addTo(map);
const layer=L.layerGroup().addTo(map);
const route=css('--route'), nightC=css('--night');
const maps=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const photos=q=>'https://duckduckgo.com/?q='+encodeURIComponent(q)+'&iax=images&ia=images';
const TAG={book:'<span class="tag book">to book</span>',market:'<span class="tag market">Christmas market</span>'};
const tabs=document.getElementById('tabs'), strip=document.getElementById('strip'), scrim=document.getElementById('scrim');
let day=null, cur=-1;

tabs.innerHTML=DAYS.map(d=>`<button class="tab" role="tab" type="button" data-id="${d.id}" aria-selected="false">${d.wd}<b>${d.date}</b>${d.m}</button>`).join('');
tabs.addEventListener('click',e=>{const t=e.target.closest('.tab');if(t)showDay(t.dataset.id,true)});

// Countdown to 23 Dec 2026
(function(){const ms=new Date('2026-12-23T12:00:00+01:00')-new Date();const d=Math.ceil(ms/864e5);
  document.getElementById('count').innerHTML=d>0?`<b>${d}</b>days to go`:'<b>🎄</b>en route';})();

function pinHTML(s,i){
  const n=`<span class="n">${i+1}</span><span class="t">${s.time}</span>`;
  return s.img?`<div class="pin ${s.night?'night':''}" style="background-image:url('${s.img}')">${n}</div>`
              :`<div class="pin icon ${s.night?'night':''}">${s.icon||'⭐'}${n}</div>`;
}
function showDay(id,fromUser){
  day=DAYS.find(d=>d.id===id)||DAYS[0]; closeCard();
  tabs.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.id===day.id));
  if(fromUser)tabs.querySelector(`[data-id="${day.id}"]`).scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  document.getElementById('plaque').innerHTML=`<span class="arr">${day.arr}</span><span class="d">${day.date}</span><span class="wd">${day.wd} · ${day.m}</span>`;
  document.getElementById('title').textContent=day.title;
  document.getElementById('sub').textContent=day.sub+' Tap a photo. 🎄';
  document.title='Paris Noël · '+day.date+' '+day.m;
  try{history.replaceState(null,'','#'+day.id)}catch(e){}
  layer.clearLayers();
  const S=day.stops;
  for(let i=0;i<S.length-1;i++){
    const a=S[i].ll,b=S[i+1].ll; if(a[0]===b[0]&&a[1]===b[1])continue;
    const col=S[i+1].night?nightC:route;
    const line=L.polyline([a,b],{color:col,weight:3,opacity:.9,dashArray:'6 7'}).addTo(layer);
    L.polylineDecorator(line,{patterns:[{offset:'58%',repeat:0,symbol:L.Symbol.arrowHead({pixelSize:13,polygon:true,pathOptions:{color:col,fillColor:col,fillOpacity:1,weight:0}})}]}).addTo(layer);
    if(S[i].leg){const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      const ic=/metro|rer|shuttle/i.test(S[i].leg)?'🚇':'🚶';
      L.marker(mid,{interactive:false,icon:L.divIcon({className:'',html:`<span class="leg">${ic} ${S[i].leg}</span>`,iconSize:null,iconAnchor:[0,-6]})}).addTo(layer);}
  }
  // stagger duplicate locations slightly so pins don't hide each other
  const seen={};
  S.forEach((s,i)=>{
    const key=s.ll.join(','); const k=seen[key]=(seen[key]||0)+1; const ll=k>1?[s.ll[0]+0.0006*(k-1),s.ll[1]+0.0009*(k-1)]:s.ll;
    const m=L.marker(ll,{title:s.name,keyboard:true,riseOnHover:true,icon:L.divIcon({className:'',iconSize:[58,58],iconAnchor:[29,29],html:pinHTML(s,i)})}).addTo(layer);
    m.on('click',()=>openCard(i));
  });
  map.fitBounds(L.latLngBounds(S.map(s=>s.ll)).pad(.25),{maxZoom:15});
  strip.innerHTML=S.map((s,i)=>`<button class="frame" data-i="${i}" type="button">${s.img?`<img src="${s.img}" alt="" loading="lazy">`:`<div class="ico">${s.icon||'⭐'}</div>`}<span><b>${i+1} · ${s.time}</b>${s.name}</span></button>`).join('');
  strip.scrollLeft=0;
}
strip.addEventListener('click',e=>{const f=e.target.closest('.frame');if(f)openCard(+f.dataset.i)});

function setActive(i){
  document.querySelectorAll('.pin').forEach((p,k)=>p.classList.toggle('active',k===i));
  document.querySelectorAll('.frame').forEach((f,k)=>f.classList.toggle('active',k===i));
}
function openCard(i){
  cur=i; const S=day.stops, s=S[i], n=S[i+1];
  const tags=[s.star?'<span class="tag star">⭐ must-do</span>':'',...(s.tags||[]).map(t=>TAG[t])].join('');
  const fig=s.img?`<figure><img src="${s.img}" alt="${s.name}"><figcaption>Photo: <a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(s.credit[2])}" target="_blank" rel="noopener">${s.credit[0]}</a>, ${s.credit[1]}</figcaption><button class="close" type="button" aria-label="Close">×</button></figure>`
                 :`<figure><div class="ico">${s.icon||'⭐'}</div><button class="close" type="button" aria-label="Close">×</button></figure>`;
  scrim.innerHTML=`<article class="card" role="dialog" aria-modal="true" aria-label="${s.name}">${fig}
    <div class="body">
      <div class="meta"><span class="num">${i+1}</span><span>${s.time}</span>${tags}</div>
      <h2>${s.name}</h2>
      <p>${s.text}</p>
      ${s.tip?`<div class="tip">${s.tip}</div>`:''}
      ${s.q?`<div class="links"><a class="btn" href="${maps(s.q)}" target="_blank" rel="noopener">📍 Google Maps</a><a class="btn" href="${photos(s.q)}" target="_blank" rel="noopener">📷 More photos</a></div>`:''}
      <div class="nav">
        <button class="btn prev" type="button" ${i===0?'disabled':''}>← Previous</button>
        <button class="btn next" type="button" ${n?'':'disabled'}>${n?`Next: ${n.name} →`:(nextDay()?`${nextDay().wd} ${nextDay().date} →`:'À bientôt!')}</button>
      </div>
    </div></article>`;
  scrim.hidden=false; setActive(i);
  map.panTo(s.ll,{animate:true});
  strip.querySelector(`[data-i="${i}"]`).scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  scrim.querySelector('.close').focus();
}
function nextDay(){const k=DAYS.indexOf(day);return DAYS[k+1];}
function closeCard(){scrim.hidden=true;setActive(-1);}
scrim.addEventListener('click',e=>{
  if(e.target===scrim||e.target.closest('.close'))closeCard();
  else if(e.target.closest('.prev')&&cur>0)openCard(cur-1);
  else if(e.target.closest('.next')){ if(cur<day.stops.length-1)openCard(cur+1); else if(nextDay()){showDay(nextDay().id,true);openCard(0);} }
});
document.addEventListener('keydown',e=>{
  if(scrim.hidden)return;
  if(e.key==='Escape')closeCard();
  if(e.key==='ArrowRight'&&cur<day.stops.length-1)openCard(cur+1);
  if(e.key==='ArrowLeft'&&cur>0)openCard(cur-1);
});

// Start on today's date during the trip, else on the linked day, else day one
(function(){
  const h=(location.hash||'').slice(1); if(DAYS.some(d=>d.id===h))return showDay(h);
  const now=new Date(), m=now.getMonth(), dd=now.getDate();
  const id=(m===11&&dd>=23)?'d'+dd:(m===0&&dd<=2?'d0'+dd:'d23');
  showDay(DAYS.some(d=>d.id===id)?id:'d23');
})();
// Falling snow
(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.getElementById('snow'),x=c.getContext('2d');let W,H,F=[];
  const P=c.parentElement;const size=()=>{W=c.width=P.clientWidth*devicePixelRatio;H=c.height=P.clientHeight*devicePixelRatio;};
  size();addEventListener('resize',size);if(window.ResizeObserver)new ResizeObserver(size).observe(P);
  for(let i=0;i<90;i++)F.push({x:Math.random(),y:Math.random(),r:1+Math.random()*2.6,s:.0006+Math.random()*.0012,d:Math.random()*6});
  (function tick(t){x.clearRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.85)';
    for(const f of F){f.y+=f.s;if(f.y>1.02){f.y=-.02;f.x=Math.random();}
      const px=(f.x+Math.sin(t/2000+f.d)*.01)*W;x.beginPath();x.arc(px,f.y*H,f.r*devicePixelRatio,0,7);x.fill();}
    requestAnimationFrame(tick);})(0);
})();
</script>
</body>
